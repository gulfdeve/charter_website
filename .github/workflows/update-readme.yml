name: Update README on Commit by Specific Developer

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md

jobs:
  update-readme:
    runs-on: ubuntu-latest
    if: github.actor == 'Hassank007'  # Replace with the specific developer's GitHub username
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Update README.md with current date
      run: |
        echo "Updating README.md with the current date..."
        current_date=$(date "+%Y-%m-%d")
        echo -e "\nUpdated on: $current_date" >> README.md

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add README.md
        git commit -m "Update README.md with current date"
        git push origin main
